; PlatformIO configuration for developing the Railuino library.
;
; The repository is an Arduino/PlatformIO library (src/, library.json,
; library.properties). This file builds ONE example against the library
; in src/, so that the library can be tested from VS Code.
;
; Le dépôt est une bibliothèque. Ce fichier compile UN exemple avec la
; bibliothèque de src/, pour la tester depuis VS Code.
;
; To try another example, change src_dir (and data_dir for WebControl).
; Pour essayer un autre exemple, changez src_dir (et data_dir pour WebControl).
; WebControl and TcpCommand need an ESP32; the other examples also build
; for uno and megaatmega2560.
;
; To check that every example compiles on every board:
;   sh extras/build_examples.sh

[platformio]
src_dir = examples/01.Controller/WebControl
data_dir = examples/01.Controller/WebControl/data
; src_dir = examples/01.Controller/Power
; src_dir = examples/01.Controller/Speed
; src_dir = examples/01.Controller/SerialCommand
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
; The library itself (this repository), with its dependencies from library.json.
lib_deps =
	symlink://.

[env:esp32dev]
; pioarduino platform (Arduino ESP32 core 3.x), pinned for reproducible builds.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
board_build.filesystem = spiffs
lib_deps =
	${env.lib_deps}
	pierremolinaro/ACAN_ESP32@^3.0.3

[env:uno]
platform = atmelavr@^5.0.0
board = uno
lib_deps =
	${env.lib_deps}
	pierremolinaro/ACAN2515@^2.1.3

[env:megaatmega2560]
platform = atmelavr@^5.0.0
board = megaatmega2560
lib_deps =
	${env.lib_deps}
	pierremolinaro/ACAN2515@^2.1.3
