# Runs on every push and pull request:
#   1. unit tests on Linux (pio test -e native, simulated CAN bus);
#   2. every example compiled for ESP32, Uno and Mega;
#   3. Arduino Lint: the rules of the Arduino Library Manager;
#   4. the AVR examples compiled as the Arduino IDE does (arduino-cli).
name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'library.json') }}

      - name: Install PlatformIO
        run: pip install platformio

      # On failure, the end of the output is also published as an
      # annotation, visible on the summary page of the run.
      - name: Unit tests
        run: |
          set +e
          pio test -e native 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Unit tests::$(tail -40 test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          exit $status
        shell: bash

      - name: Build every example
        run: |
          set +e
          sh extras/build_examples.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Examples::$(tail -40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          exit $status
        shell: bash

  arduino-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # "update": Railuino is listed in the Library Manager since
      # 13 October 2026 (arduino/library-registry #9364).
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: update
          compliance: strict

  # Same examples compiled as the Arduino IDE does (arduino-cli), with the
  # libraries of the Library Manager: the IDE finds libraries only from the
  # includes of the sketch, which PlatformIO does not show.
  arduino-ide:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn: ["arduino:avr:uno", "arduino:avr:mega"]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          libraries: |
            - source-path: ./
            - name: ACAN2515
          sketch-paths: |
            - examples/01.Controller/Power
            - examples/01.Controller/Speed
            - examples/01.Controller/Direction
            - examples/01.Controller/Headlight
            - examples/01.Controller/Function
            - examples/01.Controller/Turnout
            - examples/01.Controller/CV
            - examples/01.Controller/TestAddressLoco
            - examples/01.Controller/SerialCommand
            - examples/01.Controller/Monitor
            - examples/01.Controller/DesktopStation
            - examples/03.Mfx/MfxObserver
            - examples/03.Mfx/MfxMaster
            - examples/04.CV/MfxReadCV
            - examples/04.CV/MfxWriteName
            - examples/04.CV/MfxWriteSettings
