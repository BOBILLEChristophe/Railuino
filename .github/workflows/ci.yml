# Runs on every push and pull request:
#   1. unit tests on Linux (pio test -e native, simulated CAN bus);
#   2. every example compiled for ESP32, Uno and Mega.
name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'library.json') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Unit tests
        run: pio test -e native

      - name: Build every example
        run: sh extras/build_examples.sh
