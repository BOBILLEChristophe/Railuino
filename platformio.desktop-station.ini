; Run: pio run -c platformio.desktop-station.ini -e esp32dev
[platformio]
src_dir = examples/01.Controller/DesktopStation
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://.
    pierremolinaro/ACAN_ESP32@^3.0.3
